name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libudev-dev \
            libinput-dev libseat-dev libgbm-dev libegl-dev libdrm-dev libgles-dev \
            pkg-config xvfb xdotool weston waybar dbus gdb libxkbcommon-x11-0 libgl1-mesa-dri \
            wl-clipboard grim wlrctl wlr-randr xwayland x11-apps xterm xclip \
            xfonts-base python3-xlib seatd wayland-utils swaylock wlsunset wtype wev wayland-protocols
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo build
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - run: ./target/debug/hyprland-rust --check-config -c examples/hyprland.conf
      - name: Keybinding test (Xvfb + xdotool)
        run: sh tests/keybinds-xvfb.sh
      - name: Headless backend smoke test
        run: sh tests/headless-smoke.sh
      - name: IPC test (Xvfb + hyprctl)
        run: sh tests/ipc-xvfb.sh
      - name: Dotfile IPC test (headless + hyprctl)
        timeout-minutes: 3
        run: sh tests/ipc-dots.sh
      - name: Layer-shell test (headless + waybar)
        run: sh tests/layer-shell.sh
      - name: Master layout and groups test (headless)
        run: sh tests/master-groups.sh
      - name: Window rules test (headless + hyprctl)
        timeout-minutes: 3
        run: sh tests/window-rules.sh
      - name: Protocols test (headless + wl-clipboard)
        timeout-minutes: 3
        run: sh tests/protocols.sh
      - name: Dispatchers test (headless + hyprctl)
        timeout-minutes: 3
        run: sh tests/dispatchers.sh
      - name: xdg_popup grab test (Xvfb + weston-terminal)
        timeout-minutes: 3
        run: sh tests/popup-grab.sh
      - name: Session lock test (headless + swaylock)
        timeout-minutes: 3
        run: sh tests/session-lock.sh
      - name: hyprctl kill test (Xvfb + weston-terminal)
        timeout-minutes: 3
        run: sh tests/hyprctl-kill.sh
      - name: Screen shader test (Xvfb + grim)
        timeout-minutes: 3
        run: sh tests/screen-shader.sh
      - name: Window snap test (Xvfb + xdotool)
        timeout-minutes: 3
        run: sh tests/snap.sh
      - name: Lua config test (headless + hyprland.lua)
        timeout-minutes: 3
        run: sh tests/lua-config.sh
      - name: Popular dotfiles load without config errors
        timeout-minutes: 5
        run: sh tests/dots-conf.sh
      - name: Popular hyprland.lua dotfiles load and run
        timeout-minutes: 6
        run: sh tests/dots-lua.sh
      - name: Render effects test (winit in Xvfb + grim)
        timeout-minutes: 4
        run: sh tests/render-fx.sh
      - name: Screencopy test (winit in Xvfb + grim)
        timeout-minutes: 3
        run: sh tests/screencopy.sh
      - name: Foreign toplevel and output management test (headless + wlrctl)
        timeout-minutes: 3
        run: sh tests/foreign-toplevel.sh
      - name: Multi-monitor test (headless, 2 outputs)
        timeout-minutes: 3
        run: sh tests/multimon.sh
      - name: TTY backend on VKMS (DRM/KMS + seatd)
        timeout-minutes: 4
        run: sh tests/tty-vkms.sh
      - name: XWayland test (headless + Xwayland + X11 clients)
        timeout-minutes: 4
        run: sh tests/xwayland.sh
      - name: Protocol globals, wlsunset and wtype test (headless)
        timeout-minutes: 3
        run: sh tests/globals.sh
      - name: Protocol probe test (winit in Xvfb)
        timeout-minutes: 4
        run: sh tests/probe.sh
      - name: Session environment test (headless)
        timeout-minutes: 2
        run: sh tests/session-env.sh
