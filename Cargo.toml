[package]
name = "hyprland-rust"
version = "0.1.0"
edition = "2021"
description = "Hyprland-inspired dynamic tiling Wayland compositor written in Rust"
license = "BSD-3-Clause"
default-run = "hyprland-rust"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
# Vendored Lua 5.4 for hyprland.lua (Hyprland uses 5.5; the config API needs nothing newer).
mlua = { version = "0.10", features = ["lua54", "vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
# Same versions as smithay's: hyprland-global-shortcuts-v1 is generated from protocols/*.xml.
wayland-backend = "0.3"
wayland-server = "0.31"
wayland-scanner = "0.31"
# xcursor themes for the TTY cursor (same crate anvil uses).
xcursor = "0.3"
# Client side of the same protocols for src/bin/protocol-probe.rs.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
]
