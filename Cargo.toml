[package]
name = "hyprland-rust"
version = "0.1.0"
edition = "2021"
description = "Hyprland-inspired dynamic tiling Wayland compositor written in Rust"
license = "BSD-3-Clause"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"

[dependencies.smithay]
version = "0.7.0"
default-features = false
features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
]
